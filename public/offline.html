<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Veto City - Offline</title>
    <style>
      html, body {
        height: 100%;
        margin: 0;
        background: #09090b;
        color: #f4f4f5;
        font-family: Arial, Helvetica, sans-serif;
      }
      main {
        min-height: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        padding: 24px;
      }
      img {
        width: 96px;
        height: 96px;
        border-radius: 20px;
        margin-bottom: 20px;
      }
      h1 {
        font-size: 1.5rem;
        margin: 0 0 8px;
      }
      p {
        color: #a1a1aa;
        max-width: 320px;
        line-height: 1.5;
        margin: 0 0 20px;
      }
      button {
        background: #dc2626;
        color: white;
        border: none;
        border-radius: 9999px;
        padding: 10px 20px;
        font-size: 0.9rem;
        font-weight: 600;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/icon-192.png" alt="Veto City" />
      <h1>You&rsquo;re offline</h1>
      <p>Veto City needs a connection to load live league data. Reconnect and try again.</p>
      <button onclick="location.reload()">Retry</button>
    </main>
  </body>
</html>
